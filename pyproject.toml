[project]
name = "hidma-cli"
version = "0.1.0"
description = "Log and read time in hidma (app.hidma.com) from the terminal"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jean Galea" }]
dependencies = []

[project.optional-dependencies]
login = ["playwright"]
mcp = ["mcp>=2.2"]

[project.scripts]
hidma = "hidma.cli:main"
hidma-mcp = "hidma.mcp_server:main"

[dependency-groups]
dev = ["pytest", "playwright", "mcp>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hidma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
